<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portofolio Digital Kunjungan Museum - SMP Negeri 2 Patuk</title>
  <meta name="description" content="Aplikasi Portofolio Digital Kunjungan Museum SMP Negeri 2 Patuk.">
  <meta name="theme-color" content="#0052CC">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0052CC;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* Layar loading sementara saat aplikasi GAS dimuat */
    #loader {
      position: fixed;
      inset: 0;
      background: linear-gradient(160deg, #005B9F 0%, #0052CC 60%, #1E3A8A 100%);
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 999;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.25);
      border-top-color: #FBBF24;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #loader p {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <p>Memuat Portofolio Museum SMP Negeri 2 Patuk...</p>
  </div>

  <!-- GANTI src DI BAWAH DENGAN URL WEB APP (/exec) GOOGLE APPS SCRIPT ANDA -->
  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbyEJEekejo55du7JyJO-VAUUJwZrBHeQFijtdpuhoXkZAri89bYPxV9--k8sgQy0zh2nw/exec"
    allow="camera; microphone; fullscreen; clipboard-read; clipboard-write"
    allowfullscreen
    onload="hideLoader()">
  </iframe>

  <script>
    function hideLoader() {
      const loader = document.getElementById('loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 400);
      }
    }
  </script>

</body>
</html>
